name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages, and to mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes the one behind it but never
# cancels a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Hash routing: Pages serves static files only, so a deep path like /board
      # would 404 on reload. Assets are relative (`base: "./"`), so this build
      # also survives being served from a repository subpath.
      - name: Build
        run: npm run build
        env:
          VITE_ROUTER: hash

      # enablement: true creates the Pages site on the first run instead of
      # failing because it doesn't exist yet
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
